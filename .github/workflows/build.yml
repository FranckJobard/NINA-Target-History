name: Build Target History - NINA 3.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore NINA.TargetHistory.csproj

      - name: Build plugin
        run: dotnet build NINA.TargetHistory.csproj --configuration Release --no-restore

      - name: Prepare plugin package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item "bin\Release\net8.0-windows7.0\*" package -Recurse

      - name: Upload Target History
        uses: actions/upload-artifact@v4
        with:
          name: TargetHistory-NINA-3.2
          path: package
