name: Target History - NINA 3.2

run-name: "Target History v0.94 - Profile selection and field geometry"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - restore/pr93-add-profile-optics-columns
      - feature/manual-profile-assignment-fields

concurrency:
  group: target-history-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore NINA.TargetHistory.csproj

      - name: Build plugin
        run: dotnet build NINA.TargetHistory.csproj --configuration Release --no-restore

      - name: Prepare plugin package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item "bin\Release\net8.0-windows7.0\NINA.TargetHistory.dll" package
          if (Test-Path "bin\Release\net8.0-windows7.0\NINA.TargetHistory.pdb") { Copy-Item "bin\Release\net8.0-windows7.0\NINA.TargetHistory.pdb" package }

      - name: Upload Target History
        uses: actions/upload-artifact@v4
        with:
          name: TargetHistory-v0.94-NINA-3.2
          path: package


      - name: Upload DLL separately
        uses: actions/upload-artifact@v4
        with:
          name: TargetHistory-v0.94-DLL
          path: bin\Release\net8.0-windows7.0\NINA.TargetHistory.dll

      - name: Upload PDB separately
        uses: actions/upload-artifact@v4
        with:
          name: TargetHistory-v0.94-PDB
          path: bin\Release\net8.0-windows7.0\NINA.TargetHistory.pdb
